---
layout: default
---
<article>
  <header class="article-hero">
    <div class="container narrow">
      <nav class="breadcrumb" aria-label="İçerik yolu"><a href="{{ '/' | relative_url }}">Ana Sayfa</a><span>/</span><a href="{{ '/blog/' | relative_url }}">Blog</a></nav>
      <p class="eyebrow">Teknik Not</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="page-lead">{{ page.description }}</p>{% endif %}
      <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d.%m.%Y' }}</time> · {{ page.read_time | default: '4 dk okuma' }}</p>
    </div>
  </header>
  <div class="container narrow prose article-content">{{ content }}</div>
</article>
